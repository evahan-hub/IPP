<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balance Platform</title>
    <style id="ipp-gate-style">#app{visibility:hidden}</style>
    <script>
      (function () {
        var CODE = 'IPP2026';
        var KEY = 'ipp_unlocked';
        function reveal() {
          var s = document.getElementById('ipp-gate-style');
          if (s) s.remove();
        }
        if (sessionStorage.getItem(KEY) === '1') { reveal(); return; }
        function build() {
          var o = document.createElement('div');
          o.id = 'ipp-gate';
          o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0a0a0a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;';
          o.innerHTML = '<div style="background:#fff;padding:40px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:320px;text-align:center;">' +
            '<div style="font-size:20px;font-weight:600;margin-bottom:8px;color:#111;">Protected prototype</div>' +
            '<div style="font-size:14px;color:#666;margin-bottom:20px;">Enter the passcode to continue</div>' +
            '<input id="ipp-input" type="password" placeholder="Passcode" style="width:100%;box-sizing:border-box;padding:12px;font-size:15px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px;outline:none;" />' +
            '<button id="ipp-btn" style="width:100%;padding:12px;font-size:15px;font-weight:600;color:#fff;background:#111;border:none;border-radius:8px;cursor:pointer;">Unlock</button>' +
            '<div id="ipp-err" style="color:#d00;font-size:13px;margin-top:10px;height:16px;"></div>' +
            '</div>';
          document.body.appendChild(o);
          var input = document.getElementById('ipp-input');
          var err = document.getElementById('ipp-err');
          function submit() {
            if (input.value === CODE) {
              sessionStorage.setItem(KEY, '1');
              o.remove();
              reveal();
            } else {
              err.textContent = 'Incorrect passcode';
              input.value = '';
              input.focus();
            }
          }
          document.getElementById('ipp-btn').addEventListener('click', submit);
          input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
          input.focus();
        }
        if (document.body) build();
        else document.addEventListener('DOMContentLoaded', build);
      })();
    </script>
    <script type="module" crossorigin src="/IPP/assets/balancePlatform-ClMcmyNv.js"></script>
    <link rel="modulepreload" crossorigin href="/IPP/assets/ResizeObserver.es-4RtXNvVR.js">
    <link rel="stylesheet" crossorigin href="/IPP/assets/ResizeObserver-CMIbqPV9.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
